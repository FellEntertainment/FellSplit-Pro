name: Windows-Release bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  build-and-release:
    name: FellSplit Pro 1.3.0
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Python-Abhängigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Tests ausführen
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Portable EXE bauen
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean FellSplitPro.spec

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Windows-Installer bauen
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 wurde nicht gefunden."
          }
          & $compiler "FellSplitPro.iss"

      - name: Dateien prüfen und Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.0"
          $title = "FellSplit Pro 1.3.0"
          $installer = "installer/FellSplit-Pro-Setup-1.3.0.exe"
          $portable = "dist/FellSplitPro.exe"
          if (-not (Test-Path $installer)) { throw "Installer fehlt: $installer" }
          if (-not (Test-Path $portable)) { throw "Portable EXE fehlt: $portable" }
          $notes = @"
          FellSplit Pro 1.3.0 erkennt Monitor und Auflösung automatisch und bietet passende Layouts für 32:9, 21:9 und benutzerdefinierte Bereiche.

          Empfohlen: FellSplit-Pro-Setup-1.3.0.exe
          Alternativ: FellSplitPro.exe als portable Version

          Hinweis: Die Dateien sind noch nicht digital signiert. Windows SmartScreen kann deshalb bei neuen Downloads eine Warnung anzeigen.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes
            gh release upload $tag $installer $portable --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $installer $portable --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
